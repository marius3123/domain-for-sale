<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domeniu de vânzare</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 650px;
            text-align: center;
            padding: 65px 40px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
        }

        .label {
            font-size: 14px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #94a3b8;
            margin-bottom: 22px;
        }

h1 {
    font-size: clamp(32px, 6vw, 55px);
    font-weight: 800;
    margin-bottom: 25px;
    letter-spacing: -2px;
}
        }

        .text {
            font-size: 20px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        .price {
            font-size: 38px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .contact {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 12px;
            background: #fff;
            color: #0f172a;
            text-decoration: none;
            font-weight: 700;
            transition: 0.2s;
        }

        .contact:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .card {
                padding: 50px 25px;
            }

            .text {
                font-size: 17px;
            }

            .price {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="label">Domeniu de vânzare</div>

        <h1>e-sanatateamea.ro</h1>

        <p class="text">
            Acest domeniu este disponibil pentru vânzare.
        </p>


        <a class="contact" href="mailto:mariusg_96@hotmail.com">
            Trimite oferta
        </a>

    </div>

</body>
</html>
